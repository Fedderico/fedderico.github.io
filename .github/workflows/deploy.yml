name: Validar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar HTML
        run: npx --yes html-validate@9 "*.html"

      - name: Revisar enlaces internos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "*.html"
          fail: true

      - name: Sin texto de relleno
        run: |
          if grep -riE "lorem ipsum|TODO|a cambiar" --include="*.html" .; then
            echo "Hay texto de relleno en el sitio" && exit 1
          fi

  publicar:
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Armar carpeta del sitio
        run: mkdir _site && cp index.html estilos.css app.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
