# CI/CD del portfolio de Fede
# Cada push a "main" hace dos cosas, en orden:
#   1. CI: revisa que el HTML no tenga errores.
#   2. CD: si la revisión pasó, publica la web en GitHub Pages.
# En un pull request solo corre el CI: así se ve si algo rompe antes de mergear.
name: CI/CD del portfolio

on:
  push:
    branches: [main]      # se dispara con cada push a main
  pull_request:           # revisa los cambios propuestos, sin publicar
  workflow_dispatch:      # botón para correrlo a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  ci:
    name: Revisar (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar el HTML
        run: npx --yes html-validate@9 "**/*.html"

  cd:
    name: Publicar (CD)
    needs: ci             # si el CI falla, esto NO se ejecuta
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write        # para publicar en GitHub Pages
      id-token: write     # para que Pages verifique que el deploy viene de este repo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Solo se publica la web: README y configuración quedan fuera del sitio
      - name: Armar la carpeta del sitio
        run: mkdir _site && cp index.html _site/

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
